{% comment %}
Skladdan tovar tanlash oynasi — qarz va sotuv ekranlarida bir xil.
{% endcomment %}
{% load xozmag %}
<div class="oyna-fon" id="tovar-oyna">
  <div class="oyna">
    <div class="oyna-bosh">
      <span>Skladdan tovar tanlang</span>
      <button type="button" class="tugma tinch kichik" data-yop>
        <svg class="ikon"><use href="#i-yopish"></use></svg> Yopish (Esc)
      </button>
    </div>
    <div class="oyna-qidiruv">
      <div class="qidiruv-quti">
        <input type="text" id="tovar-qidiruv" class="kirish" placeholder="Tovar nomini yozing..."
               autocomplete="off" role="combobox" aria-expanded="false" aria-controls="tovar-dropdown">
        <div class="tovar-dropdown" id="tovar-dropdown" role="listbox"></div>
      </div>
    </div>
    <div class="oyna-tana">
      <div class="tovar-setka">
        {% for m in mahsulotlar %}
          <button type="button" class="tovar-karta {% if m.qoldiq <= 0 %}yoq{% endif %}"
                  data-id="{{ m.pk }}" data-nom="{{ m.nom }}"
                  data-narx="{{ m.narx_son }}"
                  data-qoldiq="{{ m.qoldiq|tekis }}" data-birlik="{{ m.birlik }}"
                  data-ikkinchi="{% if m.ikki_birlikmi %}{{ m.olish_qoldigi|tekis }} {{ m.olish_birligi }}{% endif %}">
            <span class="t-nom">{{ m.nom }}</span>
            <span class="t-narx">{{ m.narx|pul }} <span>so'm / {{ m.birlik }}</span></span>
            {% if m.qoldiq > 0 %}
              <span class="nishon">Omborda: {{ m.qoldiq|tekis }} {{ m.birlik }}{% if m.ikki_birlikmi %} &middot; {{ m.olish_qoldigi|tekis }} {{ m.olish_birligi }}{% endif %}</span>
            {% else %}
              <span class="nishon ogoh">Tugagan</span>
            {% endif %}
          </button>
        {% empty %}
          <div class="bosh-holat">
            <svg class="ikon"><use href="#i-quti"></use></svg>
            <b>Sklad bo'sh</b>
            <a class="tugma yashil" href="{% url 'ombor:mahsulot_yangi' %}"
               style="margin-top:12px">Tovar qo'shish</a>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
