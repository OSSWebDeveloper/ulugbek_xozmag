{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block sarlavha %}Ulug'bek Xozmak{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/uslub.css' %}">
</head>
<body>
{% include "ikonlar.html" %}

  <header class="bosh-panel">
    <div class="logo">
      <span class="belgi"><svg class="ikon"><use href="#i-dokon"></use></svg></span>
      Ulug'bek Xozmak
    </div>
    <nav>
      <a class="tugma oq" href="{% url 'qarz:boshlash' %}">
        <svg class="ikon"><use href="#i-uy"></use></svg> Bosh sahifa
      </a>
      <a class="tugma oq" href="{% url 'qarz:qarzdorlar' %}">
        <svg class="ikon"><use href="#i-odamlar"></use></svg> Qarzdorlar
      </a>
      <a class="tugma oq" href="{% url 'ombor:royxat' %}">
        <svg class="ikon"><use href="#i-quti"></use></svg> Ombor
      </a>
    </nav>
    <div class="ong">
      <button type="button" class="richag" id="richag" role="switch" aria-pressed="false"
              title="Sensorli ekran va sichqoncha rejimi o'rtasida almashtirish">
        <span class="yorliq">
          <b>Rejim</b>
          <span class="holat">Sichqoncha</span>
        </span>
        <span class="yo-l"><span class="dasta"></span></span>
      </button>
    </div>
  </header>

  {% if messages %}
    <div class="xabarlar">
      {% for xabar in messages %}
        <div class="xabar {{ xabar.tags }}">
          <svg class="ikon"><use href="#{% if 'error' in xabar.tags %}i-ogoh{% else %}i-belgi{% endif %}"></use></svg>
          <span>{{ xabar }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="sahifa">{% block tana %}{% endblock %}</main>

  <script src="{% static 'js/rejim.js' %}"></script>
  {% block skript %}{% endblock %}
</body>
</html>
