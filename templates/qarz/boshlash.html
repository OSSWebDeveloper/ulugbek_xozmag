{% extends "base.html" %}

{% block tana %}
<div class="sahifa-keng">
  <div class="sarlavha">
    Qarzdor keldi
    <span class="kichik">— qaysi biri?</span>
  </div>

  <div class="qator">
    <a class="tanlov" href="{% url 'qarz:qidirish' %}">
      <span class="belgi"><svg class="ikon"><use href="#i-qidir"></use></svg></span>
      <span class="bosh">Oldin qarz olgan</span>
      <span class="izoh">Daftarda bor mijoz — ismi yoki telefoni bo'yicha topamiz</span>
    </a>

    <a class="tanlov yangi" href="{% url 'qarz:yangi_qarzdor' %}">
      <span class="belgi"><svg class="ikon"><use href="#i-odam-plus"></use></svg></span>
      <span class="bosh">Yangi qarzdor</span>
      <span class="izoh">Birinchi marta qarz olyapti — ma'lumotini yozamiz</span>
    </a>
  </div>

  <div class="quti" style="margin-top:var(--oraliq)">
    <div class="qator">
      <a class="tugma oq" href="{% url 'qarz:qarzdorlar' %}">
        <svg class="ikon"><use href="#i-odamlar"></use></svg> Qarzdorlar ro'yxati
      </a>
      <a class="tugma oq" href="{% url 'ombor:royxat' %}">
        <svg class="ikon"><use href="#i-quti"></use></svg> Ombor (sklad)
      </a>
      <a class="tugma oq" href="{% url 'ombor:mahsulot_yangi' %}">
        <svg class="ikon"><use href="#i-plus"></use></svg> Omborga tovar qo'shish
      </a>
    </div>
  </div>
</div>
{% endblock %}
